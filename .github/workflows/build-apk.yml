
name: Build My Smart Manager APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'My_Smart_Manager_Android_Starter.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Extract source code
        run: unzip My_Smart_Manager_Android_Starter.zip -d starter

      - name: Create Flutter Android project
        run: |
          flutter create --platforms android --org com.mysmartmanager app
          cp starter/my_smart_manager/lib/main.dart app/lib/main.dart
          cp starter/my_smart_manager/pubspec.yaml app/pubspec.yaml
          cp starter/my_smart_manager/android/app/src/main/AndroidManifest.xml app/android/app/src/main/AndroidManifest.xml

          if [ -f app/android/app/build.gradle.kts ]; then
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/' app/android/app/build.gradle.kts
          elif [ -f app/android/app/build.gradle ]; then
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/' app/android/app/build.gradle
          fi

          MAIN_ACTIVITY=$(find app/android/app/src/main -name MainActivity.kt -print -quit)
          if [ -n "$MAIN_ACTIVITY" ]; then
            sed -i 's/FlutterActivity/FlutterFragmentActivity/' "$MAIN_ACTIVITY"
          fi

      - name: Build APK
        run: |
          cd app
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: My-Smart-Manager-APK
          path: app/build/app/outputs/flutter-apk/app-release.apk
          
